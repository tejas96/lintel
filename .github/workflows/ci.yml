# Quality gates for every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lintel
          POSTGRES_PASSWORD: lintel-ci
          POSTGRES_DB: lintel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lintel -d lintel_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://lintel:lintel-ci@127.0.0.1:5432/lintel_test
      TEST_DATABASE_URL: postgres://lintel:lintel-ci@127.0.0.1:5432/lintel_test
      NODE_ENV: test
      TEMPORAL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:file-size
      - run: pnpm check:boundaries
      # The web build bakes its /api rewrite in; point it at the browser tests' API port.
      - run: pnpm build
        env:
          API_INTERNAL_URL: http://127.0.0.1:4131
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @lintel/database db:migrate
      # The database integration tests look up the seeded people (+91 90000 00001 …).
      - run: pnpm --filter @lintel/database db:seed
      - name: Start a Temporal dev server for the worker's integration tests
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          "$HOME/.temporalio/bin/temporal" server start-dev --headless --port 7240 --namespace lintel --log-level error &
          for i in $(seq 1 30); do "$HOME/.temporalio/bin/temporal" operator namespace describe -n lintel --address 127.0.0.1:7240 >/dev/null 2>&1 && break; sleep 2; done
      - run: pnpm test:integration
      - name: Object storage for the browser tests (RustFS, as in infra:up)
        run: >-
          docker run -d --name lintel-object-store -p 127.0.0.1:9110:9000
          -e RUSTFS_ACCESS_KEY=lintel-local -e RUSTFS_SECRET_KEY=lintel-local-secret
          -e RUSTFS_VOLUMES=/data rustfs/rustfs:1.0.0 /data
      - run: pnpm --filter @lintel/e2e exec playwright install --with-deps chromium
      - name: Browser end-to-end and accessibility tests (fresh, seeded lintel_e2e database)
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgres://lintel:lintel-ci@127.0.0.1:5432/lintel_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
      - run: pnpm audit --prod --audit-level=critical
